<html lang="nl">
<head>

<title>Knipsel</title>

<style>
:root{--ink:#1F1B16;--muted:#6B6358;--line:#E6DECF;--panel:#F8F4EC;--hl:#FFC9B8;--accent:#F26B4E;--bg:#FFFFFF;--f:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif}
:root[data-theme="dark"]{--ink:#F3EEE6;--muted:#B5AA9A;--line:#3A342C;--panel:#26221C;--hl:#7A3A2A;--bg:#16130F}
*{box-sizing:border-box;border-radius:0}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.b{border:1px solid var(--line);background:var(--bg);padding:0 12px;min-height:32px;font-weight:500;font-size:13px}
.b:hover{border-color:var(--ink)}
.b.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.b.p{background:var(--accent);border-color:var(--accent);color:#1F1B16;font-weight:600}
.b:disabled{opacity:.4;cursor:default}
input[type=text],input[type=date],input[type=number],select,textarea{border:1px solid var(--line);background:var(--bg);padding:0 8px;min-height:32px;font-size:13px}
input:focus,select:focus,textarea:focus,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.m{color:var(--muted)}.s{font-size:12px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:8px 32px;border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:15px;letter-spacing:-.02em;white-space:nowrap}
.logo{display:inline-flex;align-items:center;gap:8px}
.lg{flex:none}
nav.st{display:flex;gap:4px;margin-left:auto;font-size:13px}
.hr0{flex:1 1 auto}
.taal{font-size:12px;color:var(--muted);align-self:flex-start;padding-top:6px}
.taal button{border:0;background:none;padding:2px 3px;color:var(--muted);font-size:12px}
.taal button.on{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
nav.st button{border:0;background:none;padding:6px 10px;color:var(--muted);border-bottom:2px solid transparent}
nav.st button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.hr{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#naam{border:0;border-bottom:1px solid var(--line);width:130px;min-height:28px}
.wrap{padding:0 32px 60px}
.zin{font-size:26px;line-height:1.75;letter-spacing:-.02em;font-weight:500;padding:26px 0 10px;max-width:1150px}
.zin .n{background:var(--accent);color:#1F1B16;padding:0 6px;font-weight:700}
.v{border:0;border-bottom:3px solid var(--accent);background:none;padding:0 2px;font:inherit;letter-spacing:inherit;line-height:1.2}
.nw{white-space:nowrap}
.v:hover,.v.on{background:var(--panel)}
.pop{border:1px solid var(--ink);padding:14px 16px;margin:4px 0 12px;max-width:760px;background:var(--bg)}
.pop h3{margin:0 0 8px;font-size:13px;font-weight:600}
.pop .rij{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.lst{max-height:300px;overflow:auto;border-top:1px solid var(--line)}
.lst label,.lst .kr{display:flex;gap:8px;align-items:center;min-height:30px;border-bottom:1px solid var(--line);font-size:13px}
.lst .kr span.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lst select{min-height:26px;font-size:12px}
.tl{margin:8px 0 0}
.tlk{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted);margin-bottom:6px}
.tlk i{display:inline-block;width:10px;height:10px;margin:0 4px 0 10px}
.bars{position:relative;height:110px;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--ink);cursor:crosshair;user-select:none;touch-action:none}
.bars .w{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%;pointer-events:none}
.bars .w.uit{opacity:.25}
.bars .sel{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.14;pointer-events:none}
.as{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding-top:4px}
.cols{display:flex;flex-wrap:wrap;gap:0 40px;margin-top:22px}
.zij{flex:0 0 170px;position:sticky;top:10px;align-self:flex-start;padding-top:8px}
.zij .g{font-size:40px;font-weight:700;letter-spacing:-.04em;line-height:1}
.spoor{height:4px;background:var(--line);margin:14px 0 6px}.spoor div{height:4px;background:var(--accent)}
.kbd{font-size:12px;line-height:1.9;margin-top:16px}
.kbd b{display:inline-block;min-width:34px;font-weight:600}
.stroom{flex:1 1 520px;max-width:800px;min-width:0}
.k{padding:16px 14px 18px;border-top:1px solid var(--line);border-left:3px solid transparent}
.k.act{background:var(--panel);border-left-color:var(--accent)}
.k.nee>h2,.k.nee>.ea{opacity:.45}
.k h2{font-size:21px;line-height:1.18;letter-spacing:-.02em;margin:4px 0 8px}
.k .lead{font-weight:600;margin:0 0 8px}
.k .ea{margin:0 0 12px;font-size:16px;line-height:1.55}
.k .acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.k .acts .sp{flex:1}
.k .vol{margin:12px 0 0;border-top:1px dashed var(--line);padding-top:10px}
.al{display:flex;gap:10px;margin:0 0 10px;font-size:15px;line-height:1.55}
.al button{flex:none;width:30px;height:24px;min-height:0;padding:0;font-size:11px;margin-top:2px}
.al.e1{background:var(--bg);box-shadow:inset 3px 0 0 var(--accent);padding:6px 8px 6px 10px}
.k.act .al.e1{background:var(--bg)}
mark{background:var(--hl);color:inherit;padding:0 2px}
.tag{font-size:11px;border:1px solid var(--line);padding:1px 6px;margin-left:6px;white-space:nowrap}
.tag.ja{background:var(--ink);color:var(--bg);border-color:var(--ink)}.tag.tw{background:var(--hl)}
.corr{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.corr{background:var(--bg);border:1px solid var(--line);padding:10px}
.corr label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-width:0}
.corr label input,.corr label select,.corr label textarea{color:var(--ink);width:100%}
.corr textarea{padding:6px 8px;resize:vertical}
.drop{border:1px dashed var(--ink);padding:44px 24px;text-align:center;margin:28px 0 18px;max-width:900px}
.drop.over{background:var(--panel)}
h1.t{font-size:26px;letter-spacing:-.02em;margin:28px 0 6px;font-weight:600}
table.f{border-collapse:collapse;font-size:13px;margin:8px 0 18px}
table.f td,table.f th{border-bottom:1px solid var(--line);padding:5px 18px 5px 0;text-align:left;font-weight:400}
table.f th{color:var(--muted);font-size:12px}
.note{max-width:760px;color:var(--muted);font-size:13px}
.note li{margin-bottom:4px}
.warn{border-left:3px solid var(--accent);padding:6px 12px;background:var(--panel);max-width:760px;margin:8px 0;font-size:13px}
textarea.ver{width:100%;max-width:760px;height:150px;padding:8px;font-size:12px}
#toast{position:fixed;left:32px;bottom:20px;background:var(--ink);color:var(--bg);padding:8px 14px;font-size:13px;display:none}
@media(max-width:700px){header,.wrap{padding-left:16px;padding-right:16px}.zin{font-size:20px}.nw{white-space:normal}.v{text-align:left}.zij{position:static;flex:1 1 100%;margin-bottom:10px}.kbd{display:none}}

  $('#app').innerHTML = `<h1 class="t">${t('exp')}</h1>
   <p style="margin:14px 0 6px;font-weight:600">${t('welke')}</p><div class="hr" style="margin-bottom:14px">${['ja', 'jt', 'f'].map(k => `<button class="b ${expWelke === k ? 'on' : ''}" data-exp="${k}">${t('e_' + k)}</button>`).join('')}<span class="m">→ ${n} ${t('artikels')}</span></div>
   <div class="hr"><button class="b p" data-a="xlsx" ${n ? '' : 'disabled'}>${t('xlsx')}</button><button class="b" data-a="zip" ${n ? '' : 'disabled'}>${t('zip')}</button><button class="b" data-a="opslaan">${t('opslaan')}</button></div>
   <p style="margin:26px 0 6px;font-weight:600">${t('verant')}</p><textarea class="ver" readonly>${esc(verantwoording())}</textarea>`;
}
const KOL = ['nr', 'beslissing', 'opmerking', 'datum', 'krant', 'land', 'soort_krant', 'type', 'editie', 'sectie', 'journalist', 'titel', 'ondertitel', 'lead', 'eerste_alinea', 'eerste_alinea_status', 'treffers', 'woorden', 'tekst', 'bron', 'bronbestand', 'positie_in_bron', 'correcties', 'opmerkingen_tool', 'id'];
function rijen(lijst){
  return lijst.map((a, i) => { const s = P.st[a.id] || {}, ki = krantInfo(veld(a, 'krant'));
    return [i + 1, s.b || '', s.opm || '', veld(a, 'datum'), veld(a, 'krant'), landNaam(landVan(a)), t(ki.soort), veld(a, 'type'), veld(a, 'editie'), veld(a, 'sectie'), veld(a, 'auteur'), veld(a, 'titel'), veld(a, 'onder'), veld(a, 'lead'), eersteTekst(a),
      s.e != null ? 'handmatig gekozen' : s.ok ? 'bevestigd' : 'door tool gekozen', treffers(a), a.w, a.al.join('\n\n'), a.bron, a.bestand, a.pos,
      s.v ? Object.keys(s.v).map(k => k + ': "' + (k === 'land' ? krantInfo(veld(a, 'krant')).land : (a[k] || '')) + '" → "' + s.v[k] + '"').join('; ') : '', a.c.join('; '), a.id]; });
}
/* zip zonder compressie + minimale xlsx, zodat er geen externe bibliotheek nodig is */
const CRC = (() => { const tb = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; tb[n] = c; } return tb; })();
function crc32(u){ let c = -1; for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ -1) >>> 0; }
function zip(files){
  const enc = new TextEncoder(), delen = [], centraal = []; let off = 0;
  for (const f of files){ const naam = enc.encode(f.naam), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30)); h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true); h.setUint32(10, 0x00210000, true);
    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, naam.length, true);
    const c = new DataView(new ArrayBuffer(46)); c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint32(12, 0x00210000, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, naam.length, true); c.setUint32(42, off, true);
    delen.push(h.buffer, naam, data); centraal.push(c.buffer, naam); off += 30 + naam.length + data.length; }
  const cl = centraal.reduce((s, x) => s + (x.byteLength), 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cl, true); e.setUint32(16, off, true);
  return new Blob([...delen, ...centraal, e.buffer]);
}
function xlsx(bladen){
  const x = s => String(s == null ? '' : s).replace(/[^\x09\x0A\x0D\x20-\uD7FF\uE000-\uFFFD]/g, '').slice(0, 32000).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const blad = rij => '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>' +
    rij.map(r => '<row>' + r.map(c => typeof c === 'number' ? `<c><v>${c}</v></c>` : `<c t="inlineStr"><is><t xml:space="preserve">${x(c)}</t></is></c>`).join('') + '</row>').join('') + '</sheetData></worksheet>';
  const files = [{naam: '[Content_Types].xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' + bladen.map((b, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') + '</Types>'},
    {naam: '_rels/.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {naam: 'xl/workbook.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' + bladen.map((b, i) => `<sheet name="${x(b.naam)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + '</sheets></workbook>'},
    {naam: 'xl/_rels/workbook.xml.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + bladen.map((b, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') + '</Relationships>'}];
  bladen.forEach((b, i) => files.push({naam: `xl/worksheets/sheet${i + 1}.xml`, data: blad(b.rijen)}));
  return zip(files);
}
function maakXlsx(lijst){ return xlsx([{naam: 'corpus', rijen: [KOL, ...rijen(lijst)]}, {naam: P.taal === 'nl' ? 'verantwoording' : 'procedure', rijen: verantwoording().split('\n').map(r => [r])}]); }
function exporteer(soort){
  const lijst = expLijst(), basis = bestandsnaam() + '_' + new Date().toISOString().slice(0, 10);
  if (soort === 'xlsx') return download(basis + '.xlsx', maakXlsx(lijst));
  const veilig = s => s.replace(/[\\/:*?"<>|]+/g, '-').trim(), files = [];
  lijst.forEach((a, i) => files.push({naam: 'artikels/' + String(i + 1).padStart(4, '0') + '_' + veilig(veld(a, 'krant')) + '_' + veld(a, 'datum').replace(/-/g, '') + '.txt',
    data: [veld(a, 'titel'), veld(a, 'onder'), [veld(a, 'krant'), dmy(veld(a, 'datum')), veld(a, 'auteur')].filter(Boolean).join(' | '), '', veld(a, 'lead'), veld(a, 'lead') ? '' : null, a.al.join('\n\n')].filter(x => x !== null && x !== undefined && !(x === '' && false)).join('\n')}));
  maakXlsx(lijst).arrayBuffer().then(buf => { files.push({naam: basis + '.xlsx', data: new Uint8Array(buf)}, {naam: 'verantwoording.txt', data: verantwoording()}, {naam: basis + '_project.json', data: JSON.stringify(P)}); download(basis + '.zip', zip(files)); });
}

/* ---------- Gebeurtenissen ---------- */
const wissel = (lijst, w, aan) => { const i = lijst.indexOf(w); if (aan && i >= 0) lijst.splice(i, 1); if (!aan && i < 0) lijst.push(w); };
document.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b){ const k = ev.target.closest('.k'); if (k && !ev.target.closest('input,select') && +k.dataset.i !== actief) zetActief(+k.dataset.i); return; }
  const d = b.dataset;
  if (d.view){ view = +d.view; pop = null; teken(); window.scrollTo(0, 0); }
  else if (d.taal){ P.taal = d.taal; zetAccent(); bewaar(); teken(); }
  else if (d.accent){ P.accent = d.accent; zetAccent(); bewaar(); }
  else if (d.pop){ pop = pop === d.pop ? null : d.pop; tekenZin(zichtbaar.length); tekenPop(); }
  else if (d.set){ P.f[d.set] = d.val; filterGewijzigd(); }
  else if (d.exp){ expWelke = d.exp; tekenExport(); }
  else if (d.b) beslis(d.id, d.b);
  else if (d.ok){ const s = S(d.ok); s.ok = s.ok ? undefined : 1; bewaar(); herteken(zichtbaar.findIndex(a => a.id === d.ok)); }
  else if (d.open){ open[d.open] = !open[d.open]; herteken(zichtbaar.findIndex(a => a.id === d.open)); }
  else if (d.eerste){ const a = P.art.find(x => x.id === d.id), s = S(d.id), j = +d.eerste; if (j === a.ei) delete s.e; else s.e = j; s.ok = 1; bewaar(); herteken(zichtbaar.findIndex(x => x.id === d.id)); }
  else if (d.corr){ corrOpen[d.corr] = !corrOpen[d.corr]; if (!corrOpen[d.corr]) ververs(false); else herteken(zichtbaar.findIndex(a => a.id === d.corr)); }
  else if (d.herstel){ delete S(d.herstel).v; bewaar(); herteken(zichtbaar.findIndex(a => a.id === d.herstel)); }
  else if (d.a === 'kies' || d.a === 'openen') $('#fin').click();
  else if (d.a === 'opslaan') slaOp();
  else if (d.a === 'nieuw'){ if (confirm(t('wis'))){ const o = nieuwProject(); o.taal = P.taal; o.accent = P.accent; P = o; view = 1; meldingen = []; bewaar(); teken(); } }
  else if (d.a === 'meer') meer();
  else if (d.a === 'hele'){ P.f.van = P.f.tot = ''; filterGewijzigd(); }
  else if (d.a === 'krAlles'){ P.f.krantUit = []; filterGewijzigd(); }
  else if (d.a === 'krNiets'){ P.f.krantUit = kranten().map(k => k[0]); filterGewijzigd(); }
  else if (d.a === 'xlsx' || d.a === 'zip') exporteer(d.a);
});
let invT = null;
document.addEventListener('input', ev => {
  const e = ev.target, d = e.dataset;
  if (e.id === 'naam'){ P.naam = e.value; bewaar(); return; }
  if (d.opm){ S(d.opm).opm = e.value || undefined; bewaar(); return; }
  if (d.fv){ P.f[d.fv] = e.type === 'number' ? Math.max(0, +e.value || 0) : e.value; if (d.fv === 'min' && P.f.min < 1) P.f.min = 1; clearTimeout(invT); invT = setTimeout(() => filterGewijzigd(false), 250); }
});
document.addEventListener('change', ev => {
  const e = ev.target, d = e.dataset;
  if (e.id === 'fin'){ leesBestanden([...e.files]); e.value = ''; return; }
  if (d.f){ wissel(P.f[d.f], e.value, e.checked); filterGewijzigd(d.f === 'soortUit'); }
  else if (d.waar){ P.f.waar[d.waar] = e.checked ? 1 : 0; filterGewijzigd(false); }
  else if (d.fb){ P.f[d.fb] = e.checked ? 1 : 0; filterGewijzigd(false); }
  else if (d.kl){ let v = e.value; if (v === '+'){ v = (prompt(t('pLand')) || '').trim(); if (!v){ tekenPop(); return; } } krantInfo(d.kl).land = v; filterGewijzigd(); }
  else if (d.ks){ krantInfo(d.ks).soort = e.value; filterGewijzigd(); }
  else if (d.cv){ const a = P.art.find(x => x.id === d.id), s = S(d.id); s.v = s.v || {}; const orig = d.cv === 'land' ? krantInfo(veld(a, 'krant')).land : (a[d.cv] || '');
    if (e.value === orig || (d.cv === 'datum' && !e.value)) delete s.v[d.cv]; else s.v[d.cv] = e.value; if (!Object.keys(s.v).length) delete s.v; bewaar(); }
});
document.addEventListener('pointerdown', sleepTijdlijn);
document.addEventListener('keydown', ev => {
  if (view !== 2 || ev.ctrlKey || ev.metaKey || ev.altKey || ev.target.closest('input,select,textarea')) return;
  const a = zichtbaar[actief], k = ev.key.toLowerCase();
  if (ev.key === 'ArrowDown'){ ev.preventDefault(); zetActief(actief + 1, true); }
  else if (ev.key === 'ArrowUp'){ ev.preventDefault(); zetActief(actief - 1, true); }
  else if (ev.key === 'Escape' && pop){ pop = null; tekenZin(zichtbaar.length); tekenPop(); }
  else if (!a) return;
  else if (k === 'j' || k === 'y') beslis(a.id, 'ja'); else if (k === 't' || k === 'u') beslis(a.id, 'twijfel'); else if (k === 'n') beslis(a.id, 'nee');
  else if (k === 'k'){ const s = S(a.id); s.ok = s.ok ? undefined : 1; bewaar(); herteken(actief); }
});
['dragover', 'dragleave', 'drop'].forEach(n => document.addEventListener(n, ev => {
  if (n !== 'dragleave') ev.preventDefault(); const dz = $('#drop'); if (dz) dz.classList.toggle('over', n === 'dragover');
  if (n === 'drop' && ev.dataTransfer && ev.dataTransfer.files.length){ if (view !== 1 && ![...ev.dataTransfer.files].some(f => /\.json$/i.test(f.name))) view = 1; leesBestanden([...ev.dataTransfer.files]); }
}));
zetAccent(); teken(); herstel();
</script>
