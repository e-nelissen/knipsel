/* ---------- Zoeken en filteren ---------- */
let zoek = {boom: null, alle: null, termen: []};
function bouwZoek(){
  let q = P.f.q.trim(); zoek = {boom: null, alle: null, termen: []}; if (!q) return;
  const rx = term => { let s = term.trim().replace(/^["“”]|["“”]$/g, '').trim(); if (!s) return null;
    s = s.replace(/[.+?^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '[\\p{L}\\p{N}]*').replace(/\s+/g, '\\s+');
    return '(?<![\\p{L}\\p{N}])' + s + '(?![\\p{L}\\p{N}])'; };

  const toks = [], re = /("[^"]*"?|“[^”]*”?)|(\()|(\))|(,)|([^\s(),"“”]+)/g; let m, woorden = [];
  const sluit = () => { if (woorden.length){ toks.push({w: woorden.join(' ')}); woorden = []; } };
  while ((m = re.exec(q))){
    if (m[1]){ sluit(); toks.push({w: m[1]}); }
    else if (m[2]){ sluit(); toks.push({o: '('}); }
    else if (m[3]){ sluit(); toks.push({o: ')'}); }
    else if (m[4]){ sluit(); toks.push({o: 'OR'}); }
    else { const x = m[5]; const o = x === 'AND' || x === 'EN' ? 'AND' : x === 'OR' || x === 'OF' ? 'OR' : x === 'NOT' || x === 'NIET' ? 'NOT' : null; if (o){ sluit(); toks.push({o}); } else woorden.push(x); }
  }
  sluit();
  let i = 0; const kijk = () => toks[i], is = o => toks[i] && toks[i].o === o;
  // OR bindt sterker dan AND (zoals in Nexis Uni); NOT betekent "en niet"; haakjes gaan voor alles
  function een(){ const k = kijk(); if (!k) return null;
    if (k.o === 'NOT'){ i++; const n = een(); return n && {not: n}; }
    if (k.o === '('){ i++; const n = expr(); if (is(')')) i++; return n; }
    if (k.w){ i++; const r = rx(k.w); if (!r) return null; try { return {t: new RegExp(r, 'iu'), r, label: k.w.replace(/^["“”]|["“”]$/g, '')}; } catch (e){ return null; } }
    i++; return null; }
  function of_(){ const d = [een()]; while (is('OR')){ i++; d.push(een()); } const g = d.filter(Boolean); return g.length > 1 ? {or: g} : g[0] || null; }
  function expr(){ const d = [of_()]; while (i < toks.length && !is(')')){ if (is('NOT')){ i++; const n = of_(); if (n) d.push({not: n}); } else { if (is('AND')) i++; d.push(of_()); } } const g = d.filter(Boolean); return g.length > 1 ? {and: g} : g[0] || null; }
  let boom = null; while (i < toks.length){ const n = expr(); if (n) boom = boom ? {and: [boom, n]} : n; if (is(')')) i++; }
  zoek.boom = boom; if (!boom) return;
  const pos = []; (function loop(n, neg){ if (n.t){ if (!neg) pos.push(n); } else if (n.not) loop(n.not, !neg); else (n.and || n.or).forEach(x => loop(x, neg)); })(boom, false);
  for (const n of pos) if (!zoek.termen.some(z => z.label.toLowerCase() === n.label.toLowerCase())) zoek.termen.push({label: n.label, re: new RegExp(n.r, 'giu')});

}
function zoekPast(n, tx){ return n.t ? n.t.test(tx) : n.not ? !zoekPast(n.not, tx) : n.and ? n.and.every(x => zoekPast(x, tx)) : n.or.some(x => zoekPast(x, tx)); }
const alOf = a => { const s = P.st[a.id]; return s && s.tx ? a.al.map((p, j) => s.tx[j] != null ? s.tx[j] : p) : a.al; };
const eIdx = a => { const s = P.st[a.id], al = alOf(a); if (s && s.e != null) return s.e; const w = weg(a); if (!w.includes(a.ei)) return a.ei; for (let j = Math.max(a.ei, 0); j < al.length; j++) if (!w.includes(j)) return j; for (let j = 0; j < al.length; j++) if (!w.includes(j)) return j; return -1; };
const basisKrant = a => (P.alias && P.alias[a.krant]) || a.krant;
const veld = (a, k) => { const s = P.st[a.id]; return s && s.v && s.v[k] != null ? s.v[k] : k === 'krant' ? basisKrant(a) : a[k]; };
const landVan = a => veld(a, 'land') || krantInfo(veld(a, 'krant')).land;
const weg = a => { const s = P.st[a.id]; return (s && s.weg) || []; };
const alineas = a => { const w = weg(a), al = alOf(a); return w.length ? al.filter((x, j) => !w.includes(j)) : al; };
const woorden = a => weg(a).length || (P.st[a.id] || {}).tx ? (alineas(a).join(' ') + ' ' + (veld(a, 'lead') || '')).split(/\s+/).filter(Boolean).length : a.w;

const eersteTekst = a => { const i = eIdx(a); return i >= 0 ? alOf(a)[i] || '' : ''; };
const typeGroep = ty => ty === 'krant' ? 'print' : ty === 'online' ? 'online' : ty;
function past(a, zonderDatum){
  const f = P.f, kr = veld(a, 'krant'), ki = krantInfo(kr), d = veld(a, 'datum'), s = P.st[a.id] || {};
  if (f.groep) return SIM.groep[a.id] === f.groep;
  if (f.landUit.includes(landVan(a)) || f.krantUit.includes(kr) || f.soortUit.includes(ki.soort) || (f.indUit || []).includes(ki.ind || '')) return false;
  if (f.typeUit.includes(typeGroep(veld(a, 'type')))) return false;
  if (!zonderDatum && ((f.van && d < f.van) || (f.tot && d > f.tot))) return false;
  if (f.minW && woorden(a) < f.minW) return false;
  if (f.groep && SIM.groep[a.id] !== f.groep) return false;
  if (f.simAlleen && !SIM.groep[a.id]) return false;
  if (f.besl !== 'alle' && (s.b || 'open') !== f.besl) return false;
  if (f.ea === 'twijfel' && (!redenen(a).length || aangepast(a))) return false;

/* ---------- Gelijkaardige artikels (containment van woordreeksen, Broder 1997) ---------- */
const SH = 5, SH_MIN = 10, SH_MAX_DF = 300;
let SIM = {sleutel: null, groep: {}, buren: {}, aantal: 0}, simVer = 0;
const tekstGewijzigd = () => { simVer++; };
function fnv(str){ let h = 0x811c9dc5; for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function shingles(a){
  const w = (veld(a, 'titel') + ' ' + (veld(a, 'lead') || '') + ' ' + alineas(a).join(' ')).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim().split(' ').filter(Boolean);
  const set = new Set(); for (let i = 0; i + SH <= w.length; i++) set.add(fnv(w.slice(i, i + SH).join(' '))); return set;
}
function zorgSim(){
  const sleutel = P.art.length + '|' + P.f.sim + '|' + simVer + '|' + (P.art[0] || {}).id;
  if (SIM.sleutel === sleutel) return;
  const n = P.art.length, sets = P.art.map(shingles), idx = new Map(), gedeeld = new Map();
  sets.forEach((st, i) => { if (st.size < SH_MIN) return; for (const h of st){ let l = idx.get(h); if (!l) idx.set(h, l = []); l.push(i); } });
  for (const l of idx.values()){ if (l.length < 2 || l.length > SH_MAX_DF) continue; for (let x = 0; x < l.length; x++) for (let y = x + 1; y < l.length; y++){ const k = l[x] * n + l[y]; gedeeld.set(k, (gedeeld.get(k) || 0) + 1); } }
  const ouder = P.art.map((_, i) => i), wortel = i => { while (ouder[i] !== i){ ouder[i] = ouder[ouder[i]]; i = ouder[i]; } return i; };
  const buren = {};
  for (const [k, c] of gedeeld){ const i = Math.floor(k / n), j = k % n, c2 = c / Math.min(sets[i].size, sets[j].size);
    if (c2 >= P.f.sim){ ouder[wortel(i)] = wortel(j); (buren[P.art[i].id] = buren[P.art[i].id] || []).push([P.art[j].id, c2]); (buren[P.art[j].id] = buren[P.art[j].id] || []).push([P.art[i].id, c2]); } }
  const groep = {}, nr = {}; let teller = 0;
  P.art.forEach((a, i) => { if (!buren[a.id]) return; const w = wortel(i); if (nr[w] == null) nr[w] = ++teller; groep[a.id] = nr[w]; });
  for (const id in buren) buren[id].sort((x, y) => y[1] - x[1]);
  SIM = {sleutel, groep, buren, aantal: teller};
}
const groepGrootte = g => Object.values(SIM.groep).filter(x => x === g).length;
const pct = x => Math.round(x * 100) + '%';
function burenTekst(a){ return (SIM.buren[a.id] || []).map(([id, c]) => { const b = P.art.find(x => x.id === id); return b ? veld(b, 'krant') + ' ' + dmy(veld(b, 'datum')) + ' (' + pct(c) + ')' : ''; }).filter(Boolean); }
function trefTekst(a){ return veld(a, 'titel') + '\n' + veld(a, 'onder') + '\n' + veld(a, 'lead') + '\n' + alineas(a).join('\n'); }
function trefPerTerm(a){ const tx = trefTekst(a); return zoek.termen.map(z => { const m = tx.match(z.re); return [z.label, m ? m.length : 0]; }); }
function treffers(a){ if (!zoek.alle) return 0; const m = (veld(a, 'titel') + '\n' + veld(a, 'onder') + '\n' + veld(a, 'lead') + '\n' + alineas(a).join('\n')).match(zoek.alle); return m ? m.length : 0; }
function mark(s){ if (!zoek.alle || !s) return esc(s); let uit = '', l = 0, m; zoek.alle.lastIndex = 0;
  while ((m = zoek.alle.exec(s))){ if (!m[0]){ zoek.alle.lastIndex++; continue; } uit += esc(s.slice(l, m.index)) + '<mark>' + esc(m[0]) + '</mark>'; l = m.index + m[0].length; }
  return uit + esc(s.slice(l)); }

let TLb = [];
function bucket(d, eenheid){ if (eenheid === 'dag') return d; if (eenheid === 'maand') return d.slice(0, 7) + '-01';
  const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() - (x.getUTCDay() + 6) % 7); return x.toISOString().slice(0, 10); }
function volgende(d, eenheid){ const x = new Date(d + 'T00:00:00Z'); if (eenheid === 'dag') x.setUTCDate(x.getUTCDate() + 1); else if (eenheid === 'week') x.setUTCDate(x.getUTCDate() + 7); else x.setUTCMonth(x.getUTCMonth() + 1); return x.toISOString().slice(0, 10); }
const dagVoor = d => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() - 1); return x.toISOString().slice(0, 10); };
function tekenTijdlijn(){
  let lijst = P.art.filter(a => past(a, true)); const e = $('#tl');
  if (!lijst.length){ e.innerHTML = ''; TLb = []; return; }
  const ds = lijst.map(a => veld(a, 'datum')).sort(), dd = (x, y) => (new Date(y) - new Date(x)) / 864e5;
  const kN = Math.max(2, Math.ceil(ds.length * 0.8)); let kMin = ds[0], kMax = ds[ds.length - 1], kBest = Infinity;
  for (let i = 0; i + kN - 1 < ds.length; i++){ const sp = dd(ds[i], ds[i + kN - 1]); if (sp < kBest){ kBest = sp; kMin = ds[i]; kMax = ds[i + kN - 1]; } }
  const kanZoom = ds.length > 20 && dd(ds[0], ds[ds.length - 1]) > 2 * Math.max(dd(kMin, kMax), 14), zoom = kanZoom && P.f.tlZoom === 'kern';
  let min = ds[0], max = ds[ds.length - 1], buiten = 0;
  if (zoom){ min = kMin; max = kMax; const n0 = lijst.length; lijst = lijst.filter(a => { const d = veld(a, 'datum'); return d >= min && d <= max; }); buiten = n0 - lijst.length; }
  const dagen = dd(min, max);
  const eenheid = dagen <= 62 ? 'dag' : dagen <= 800 ? 'week' : 'maand', perKrant = P.f.tlg === 'krant';
  const sleutel = a => perKrant ? veld(a, 'krant') : landVan(a), naam = k => perKrant ? k : landNaam(k);
  const KL = ['#FECBA2', '#70B9BB', '#BFAAC8', '#C4D792', '#BEC7E6'];
  const vol = {}; for (const a of P.art){ const k = sleutel(a); vol[k] = (vol[k] || 0) + 1; }
  const alleVol = Object.keys(vol).sort((a, b) => vol[b] - vol[a] || a.localeCompare(b));
  const vast = alleVol.length <= KL.length ? alleVol : alleVol.slice(0, KL.length - 1);
  const lt = {}; for (const a of lijst){ const k = sleutel(a); lt[k] = (lt[k] || 0) + 1; }
  const alle = Object.keys(lt), top = vast.filter(k => lt[k]), OV = '\u0000ov', groep = k => vast.includes(k) ? k : OV;
  const kleur = g => g === OV ? '#E6E4DF' : KL[vast.indexOf(g)];
  const groepen = top.concat(alle.some(k => !vast.includes(k)) ? [OV] : []), gt = {};
  const tel = {}; for (const a of lijst){ const b = bucket(veld(a, 'datum'), eenheid), g = groep(sleutel(a)); (tel[b] = tel[b] || {})[g] = (tel[b][g] || 0) + 1; gt[g] = (gt[g] || 0) + 1; }
  TLb = []; for (let b = bucket(min, eenheid); b <= max; b = volgende(b, eenheid)){ TLb.push(b); if (TLb.length > 1500) break; }
  const hoog = Math.max(...TLb.map(b => Object.values(tel[b] || {}).reduce((x, y) => x + y, 0)), 1), f = P.f;
  const inSel = b => (!f.van || volgende(b, eenheid) > f.van) && (!f.tot || b <= f.tot);
  e.dataset.eenheid = eenheid;
  e.innerHTML = `<div class="tlk"><span>${t(eenheid === 'dag' ? 'perDag' : eenheid === 'week' ? 'perWeek' : 'perMaand')} · <span class="tlsw"><button class="${perKrant ? '' : 'on'}" data-a="${perKrant ? 'tlg' : ''}">${t('perLand')}</button><button class="${perKrant ? 'on' : ''}" data-a="${perKrant ? '' : 'tlg'}">${t('perKrant')}</button></span>${kanZoom ? ` · <span class="tlsw"><button class="${zoom ? '' : 'on'}" data-a="${zoom ? 'tlz' : ''}">${t('zAlles')}</button><button class="${zoom ? 'on' : ''}" data-a="${zoom ? '' : 'tlz'}">${t('zKern')}</button></span>${buiten ? ` (${t('buiten', {n: buiten})})` : ''}` : ''} · ${t('sleep')}${f.van || f.tot ? ` · <button class="v" data-a="hele">${t('hele')}</button>` : ''}</span>
   <span>${groepen.map(g => `<i style="background:${kleur(g)}"></i>${esc(g === OV ? t('overig') + ' (' + alle.filter(k => !vast.includes(k)).length + ')' : naam(g))} ${gt[g]}`).join('')}</span></div>
   <div class="bars" id="bars" role="img" aria-label="${t('perWeek')}">${TLb.map(b => `<div class="w ${inSel(b) ? '' : 'uit'}" title="${dmy(b)}: ${groepen.filter(g => tel[b] && tel[b][g]).map(g => (g === OV ? t('overig') : naam(g)) + ' ' + tel[b][g]).join(', ') || 0}">${groepen.slice().reverse().map(g => tel[b] && tel[b][g] ? `<div style="height:${tel[b][g] / hoog * 100}%;background:${kleur(g)}"></div>` : '').join('')}</div>`).join('')}<div class="sel" id="sel" style="display:none"></div></div>
   <div class="as"><span>${dmy(min)}</span><span>${dmy(max)}</span></div>`;
}
function sleepTijdlijn(ev){
  const bars = ev.target.closest('#bars'); if (!bars || !TLb.length) return;
  const r = bars.getBoundingClientRect(), idx = x => Math.max(0, Math.min(TLb.length - 1, Math.floor((x - r.left) / r.width * TLb.length))), i0 = idx(ev.clientX), sel = $('#sel');
  let i1 = i0; const toon = () => { const a = Math.min(i0, i1), b = Math.max(i0, i1); sel.style.display = 'block'; sel.style.left = a / TLb.length * 100 + '%'; sel.style.width = (b - a + 1) / TLb.length * 100 + '%'; };
  toon(); bars.setPointerCapture(ev.pointerId);

    const a = Math.min(i0, i1), b = Math.max(i0, i1), eenheid = $('#tl').dataset.eenheid;

/* zip zonder compressie + minimale xlsx, zodat er geen externe bibliotheek nodig is */
const CRC = (() => { const tb = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; tb[n] = c; } return tb; })();

  for (const f of files){ const naam = enc.encode(f.naam), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30)); h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true); h.setUint32(10, 0x00210000, true);
    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, naam.length, true);
    const c = new DataView(new ArrayBuffer(46)); c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint32(12, 0x00210000, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, naam.length, true); c.setUint32(42, off, true);
    delen.push(h.buffer, naam, data); centraal.push(c.buffer, naam); off += 30 + naam.length + data.length; }

  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cl, true); e.setUint32(16, off, true);

}
function xlsx(bladen){
  const x = s => String(s == null ? '' : s).replace(/[^\x09\x0A\x0D\x20-\uD7FF\uE000-\uFFFD]/g, '').slice(0, 32000).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

    rij.map(r => '<row>' + r.map(c => typeof c === 'number' ? `<c><v>${c}</v></c>` : `<c t="inlineStr"><is><t xml:space="preserve">${x(c)}</t></is></c>`).join('') + '</row>').join('') + '</sheetData></worksheet>';
  const files = [{naam: '[Content_Types].xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' + bladen.map((b, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') + '</Types>'},
    {naam: '_rels/.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {naam: 'xl/workbook.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' + bladen.map((b, i) => `<sheet name="${x(b.naam)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + '</sheets></workbook>'},
    {naam: 'xl/_rels/workbook.xml.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + bladen.map((b, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') + '</Relationships>'}];
