const NIET_INH = /^(bekijk|lees) (ook|nu|meer)\b|^van onze (redacteur|redactrice|correspondent|medewerker|reporter)|^-\S|^(read|see) (also|more)\b|^dit artikel verscheen (oorspronkelijk|eerder|eerst)\b|^this article (was )?(originally|first) (appeared|published)\b/i;
function zoekEerste(al, kaders){
  const kand = al.map((a, i) => i).filter(i => !(kaders && kaders.has(al[i])) && !NIET_INH.test(al[i]));
  for (const i of kand){ if (al[i].split(/\s+/).length >= MIN_W) return i; }
  return kand.length ? kand[0] : -1;
}
function controle(al, ei, extra){
  const c = extra || [], e = ei >= 0 ? al[ei] : '';
  if (al.length === 1) c.push('geen alineagrenzen in bron');
  if (!al.length) c.push('geen tekst gevonden');
  if (e && e.split(/\s+/).length < 10) c.push('kort');
  if (e.endsWith('...') || e.endsWith('…')) c.push('afgekapte tekst');
  if (ei > 0) c.push('alinea overgeslagen');
  return c;
}
function maakArtikel(o){

}
